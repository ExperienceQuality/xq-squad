# CI on every pull request and every push to main.
# Always runs validate + the full test suite. Does not publish releases.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: validate-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate distribution
        run: bash scripts/validate.sh

      - name: Run Node tests
        run: node --test tests/*.test.mjs

      - name: Run shell tests
        run: |
          shopt -s nullglob
          tests=(tests/*.test.sh)
          if (( ${#tests[@]} == 0 )); then
            echo "No tests/*.test.sh files found" >&2
            exit 1
          fi
          for t in "${tests[@]}"; do
            echo "==> $t"
            bash "$t"
          done
