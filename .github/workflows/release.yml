name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v1.0.0). Defaults to release_tag in distribution/.squad/squad.json."
        required: false
        type: string

# Always validate and test on this workflow. Packaging/publishing still skip
# when the tag or GitHub Release already exists. Prefer merging a dedicated
# release PR (#29); do not direct-push version bumps to main (process).
jobs:
  # Same checks as CI. Kept in-workflow so a Release run cannot publish without
  # a green test job even if the separate CI workflow is delayed or missing.
  test:
    name: validate-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate distribution
        run: bash scripts/validate.sh

      - name: Run Node tests
        run: node --test tests/*.test.mjs

      - name: Run shell tests
        run: |
          shopt -s nullglob
          tests=(tests/*.test.sh)
          if (( ${#tests[@]} == 0 )); then
            echo "No tests/*.test.sh files found" >&2
            exit 1
          fi
          for t in "${tests[@]}"; do
            echo "==> $t"
            bash "$t"
          done

  release:
    name: package-and-publish
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(node -e "console.log(JSON.parse(require('fs').readFileSync('distribution/.squad/squad.json','utf8')).release_tag)")"
          fi
          if [[ ! "$VERSION" =~ ^v ]]; then
            echo "Error: version must start with 'v', got '$VERSION'" >&2
            exit 1
          fi
          echo "Resolved version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1 || gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release already exists — skipping package and publish"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package release
        if: steps.guard.outputs.skipped != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/package-release.sh --version "$VERSION" --output .releases

      - name: Create tag
        if: steps.guard.outputs.skipped != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          git tag -a -m "Release $VERSION" "$VERSION"
          git push origin "$VERSION"

      - name: Create GitHub release
        if: steps.guard.outputs.skipped != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          NOTES_FILE="$(mktemp)"
          AUTO_FILE="$(mktemp)"
          CHANGELOG_FILE="$(mktemp)"
          VER_NO_V="${VERSION#v}"
          # This release's CHANGELOG section (breaking / required-behavior lives here).
          awk -v ver="$VER_NO_V" '
            $0 ~ ("^## \\[" ver "\\]") { p=1; print; next }
            p && /^## \[/ { exit }
            p { print }
          ' CHANGELOG.md > "$CHANGELOG_FILE"
          if [[ ! -s "$CHANGELOG_FILE" ]]; then
            echo "Error: no CHANGELOG.md section for [$VER_NO_V]" >&2
            exit 1
          fi
          # Auto-generated PR list (same source as --generate-notes).
          gh api "repos/${REPO}/releases/generate-notes" \
            -f tag_name="$VERSION" \
            -f target_commitish="${{ github.sha }}" \
            --jq .body > "$AUTO_FILE"
          {
            echo "## Upgrade / rollback"
            echo
            echo "Consumers: follow the [README Upgrade](https://github.com/ExperienceQuality/xq-squad/blob/${VERSION}/README.md#upgrade) and [Rollback](https://github.com/ExperienceQuality/xq-squad/blob/${VERSION}/README.md#rollback) sections."
            echo
            echo "Pinned upgrade command:"
            echo
            echo '```bash'
            echo "curl -LsSf https://github.com/ExperienceQuality/xq-squad/releases/download/${VERSION}/update.sh | sh -s -- --target . --version ${VERSION}"
            echo '```'
            echo
            echo "---"
            echo
            echo "## Changelog (this release)"
            echo
            echo "Breaking or required-behavior changes, if any, are called out in this section (and must appear in CHANGELOG.md on the release PR)."
            echo
            cat "$CHANGELOG_FILE"
            echo
            echo "Full history: [CHANGELOG.md](https://github.com/ExperienceQuality/xq-squad/blob/${VERSION}/CHANGELOG.md)."
            echo
            echo "---"
            echo
            cat "$AUTO_FILE"
          } > "$NOTES_FILE"
          gh release create "$VERSION" \
            --title "XQ Squad $VERSION" \
            --notes-file "$NOTES_FILE"
          gh release upload "$VERSION" install.sh update.sh ".releases/squad-${VERSION}.tar.gz" ".releases/squad-${VERSION}.tar.gz.sha256" --clobber
